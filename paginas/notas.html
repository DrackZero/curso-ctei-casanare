<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis notas · Innovación pública y proyectos CTeI · Gobernación de Casanare</title>
  <meta name="description" content="Curso virtual de autoformación tipo MOOC en innovación pública y formulación de proyectos CTeI — Gobernación de Casanare.">
  <link rel="icon" href="../assets/favicon.ico">

  <!-- Tipografías institucionales -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">

  <!-- Hojas de estilo: base → layout → componentes → vistas -->
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/vistas.css">

  <!-- Iconos -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js" crossorigin="anonymous" defer></script>
  <!-- Estilos de la pantalla de carga: en línea para que funcionen aunque el navegador
       tenga en caché una hoja de estilos anterior -->
  <style>
    .carga{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;
      background:#fff;transition:opacity .3s ease,visibility .3s ease;font-family:"Work Sans",system-ui,sans-serif}
    .carga.saliendo{opacity:0;visibility:hidden}
    .carga-circulo{width:46px;height:46px;border-radius:50%;border:4px solid #DCE5DF;border-top-color:#0B5D3B;animation:carga-giro .8s linear infinite}
    .carga-texto{font-size:.9rem;color:#3D5147;letter-spacing:.02em}
    @keyframes carga-giro{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.carga-circulo{animation-duration:2.4s}.carga{transition:none}}
    @media print{.carga{display:none}}
  </style>
</head>

<body>
  <!-- Pantalla de carga: visible de inmediato; js/ui/carga.js la retira al terminar
       y la vuelve a mostrar al navegar a otra página de la plataforma -->
  <div id="carga" class="carga" role="status" aria-live="polite">
    <div class="carga-circulo" aria-hidden="true"></div>
    <div class="carga-texto">Cargando…</div>
  </div>


  <!-- Encabezado institucional: franja GOV.CO, enlaces de utilidad y menú.
       Lo arma js/ui/cabecera.js -->
  <div id="cabecera"></div>

  <!-- Contenido: historial de notas y avance del participante.
       Lo arma js/vistas/notas.js -->
  <main class="pagina" id="contenido"></main>

  <!-- Pie institucional: banda de valores CTeI y datos de contacto.
       Lo arma js/ui/pie.js -->
  <div id="pie"></div>

  <!-- Barra lateral fija de enlaces institucionales -->
  <nav id="lateral"></nav>

  <!-- Elementos de apoyo: visor de imagen ampliada y avisos emergentes -->
  <div id="lupa"></div>
  <div id="aviso" hidden class="aviso"></div>

  <script src="../js/vendor/supabase.js"></script>

  <script type="module" src="../js/vistas/notas.js"></script>

</body>

</html>
